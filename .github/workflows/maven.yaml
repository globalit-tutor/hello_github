name: spring boot3 maven

on:
  workflow_dispatch

jobs:
  spring_boot3_maven_build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven 
       
      - name: grant execute permission
        run: chmod  +x  mvnw
        
      - name: build with gradle
        run: ./mvnw  clean  build
        
      - name: list build/libs directory
        run:  ls -al  ./target  

      - name: run springboot application
        run: |
          java  -jar   ./target/demo-0.0.1-SNAPSHOT.jar  &
          sleep  30   #  stand by 30 sec 

      - name: run automated test #1
        run: |
          curl  http://localhost:8080   ||   exit  -1   
